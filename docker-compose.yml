name: football

services:
  mariadb:
    image: docker.io/library/mariadb:10.11
    container_name: foosball-mariadb
    network_mode: host
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: nykreditfoosballunity
      MARIADB_USER: football
      MARIADB_ALLOW_EMPTY_PASSWORD: "yes"
    volumes:
      - mariadb-data:/var/lib/mysql
      - ../TableSoccerREST/db-init:/docker-entrypoint-initdb.d:ro,Z
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  backend:
    build: ../TableSoccerREST
    image: foosball-backend:latest
    container_name: foosball-backend
    network_mode: host
    working_dir: /usr/src/app
    volumes:
      - ../TableSoccerREST:/usr/src/app:Z
      - gradle-cache:/root/.gradle
    command: ["./gradlew", "run"]
    depends_on:
      mariadb:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: .
    image: foosball-frontend:latest
    container_name: foosball-frontend
    network_mode: host
    working_dir: /usr/src/app
    volumes:
      - .:/usr/src/app:Z
    command: ["sh", "-c", "[ -d node_modules ] || npm install; node node_modules/.bin/ng serve --host 0.0.0.0 --port 4200"]
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mariadb-data:
  gradle-cache:
